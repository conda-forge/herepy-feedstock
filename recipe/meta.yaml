{% set name = "herepy" %}
{% set version = "3.7.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 23b21e9b351ee5c35c77917b823d4f2cb6fd4a5b67ae24cc29b4ab86f42f140c
build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - httpx2 >=2.14.0
    - requests >=2.25.1,<3

test:
  requires:
    - python {{ python_min }}
  imports:
    - herepy

about:
  home: https://github.com/abdullahselek/HerePy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A library that provides a Python interface to the HERE APIs
  description: |
    A Python interface to HERE location APIs with support for synchronous and asynchronous HTTP calls.
  doc_url: https://abdullahselek.github.io/HerePy/
  dev_url: https://github.com/abdullahselek/HerePy

extra:
  recipe-maintainers:
    - abdullahselek
